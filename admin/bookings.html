<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Bookings | Aurelio Hotels Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231F3D2C%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%23D9AE73%22 text-anchor=%22middle%22 font-family=%22Georgia%22>A</text></svg>">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="page-loader"><div class="brand-mark">A</div></div>

<nav class="navbar is-scrolled">
  <div class="container" style="max-width:100%; padding: 0 24px;">
    <a href="../index.html" class="brand"><span class="brand-mark">A</span> Aurelio <span class="chip" style="margin-left:8px;">Admin</span></a>
    <div class="nav-actions">
      <div id="navAuthArea"></div>
      <button class="dash-menu-btn" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="dash-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Overview</div>
      <a href="dashboard.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Manage</div>
      <a href="rooms.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-8a2 2 0 012-2h4a2 2 0 012 2v3M3 18v2M3 18h18M13 13h6a2 2 0 012 2v3M21 18v2M7 11V7a2 2 0 012-2h0"/></svg>Rooms</a>
      <a href="bookings.html" class="sidebar-link active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
      <a href="customers.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Customers</a>
      <a href="messages.html" class="sidebar-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        Messages
        <span class="count hidden" id="sidebarMessagesCount">0</span>
      </a>
      <a href="reports.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-4"/></svg>Reports</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Setup</div>
      <a href="seed.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Demo data</a>
    </div>
    <div class="sidebar-footer">
      <a href="../index.html" class="sidebar-link"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Back to site</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-header">
      <div><h1>Bookings</h1><p>Approve, cancel, and track every reservation.</p></div>
    </div>

    <div class="card panel">
      <div class="panel-head">
        <div class="panel-tabs">
          <button class="panel-tab active" data-status="all">All</button>
          <button class="panel-tab" data-status="pending">Pending</button>
          <button class="panel-tab" data-status="confirmed">Confirmed</button>
          <button class="panel-tab" data-status="completed">Completed</button>
          <button class="panel-tab" data-status="cancelled">Cancelled</button>
        </div>
        <div class="input-icon-wrap" style="max-width:260px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="bookingSearchInput" class="input" placeholder="Search guest, code, room…">
        </div>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Code</th><th>Guest</th><th>Room</th><th>Dates</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="bookingsTbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Booking detail modal -->
<div class="modal-overlay" id="bookingDetailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Booking details</h3>
      <button class="modal-close" id="bookingDetailClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="bookingDetailBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/utils.js"></script>
<script>const REQUIRE_AUTH = true; const REQUIRE_ADMIN = true;</script>
<script src="../js/auth-guard.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/admin-bookings.js"></script>
<script>
  document.getElementById("sidebarToggle")?.addEventListener("click", () => { document.getElementById("sidebar").classList.add("open"); document.getElementById("sidebarOverlay").classList.add("open"); });
  document.getElementById("sidebarOverlay")?.addEventListener("click", () => { document.getElementById("sidebar").classList.remove("open"); document.getElementById("sidebarOverlay").classList.remove("open"); });
</script>
</body>
</html>
