<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Aurelio Hotels</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231F3D2C%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%23D9AE73%22 text-anchor=%22middle%22 font-family=%22Georgia%22>A</text></svg>">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=1200&q=80" alt="Aurelio deluxe bedroom">
    <div class="overlay">
      <a href="index.html" class="brand"><span class="brand-mark">A</span> Aurelio</a>
      <blockquote>"Traveled with three kids and the Family Room bunk nook was a genuine lifesaver."<cite>— Marcus Ferreira, Family Room guest</cite></blockquote>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="index.html" class="brand"><span class="brand-mark">A</span> Aurelio</a>
      <h1>Create your account</h1>
      <p class="sub">Book rooms, track your stays, and check out faster next time.</p>

      <div class="form-alert hidden" id="authAlert"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="registerName">Full name</label>
          <input type="text" id="registerName" class="input" placeholder="Jordan Ellis" required autocomplete="name">
        </div>
        <div class="field">
          <label for="registerEmail">Email address</label>
          <input type="email" id="registerEmail" class="input" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="registerPhone">Phone <span class="text-faint">(optional)</span></label>
          <input type="tel" id="registerPhone" class="input" placeholder="+1 (305) 555-0148" autocomplete="tel">
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" class="input" placeholder="At least 6 characters" required autocomplete="new-password">
          <div class="password-strength" id="passwordStrength"><span></span><span></span><span></span><span></span></div>
        </div>
        <label class="checkbox-row mb-4">
          <input type="checkbox" id="registerTerms">
          I agree to the Terms of Service and Privacy Policy
        </label>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerSubmitBtn">Create account</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
